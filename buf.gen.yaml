version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/vercel/bridge/api/go
    # Vendored from vercel/api, which names it vercel.api.dev_tunnel.v1.
    - file_option: go_package
      path: vercel/api/dev_tunnel/v1/tunnel.proto
      value: github.com/vercel/bridge/api/go/vercel/api/dev_tunnel/v1;devtunnel
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
plugins:
  # Go plugins
  - remote: buf.build/protocolbuffers/go
    out: api/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: api/go
    opt:
      - paths=source_relative
  # TypeScript plugins
  - remote: buf.build/bufbuild/es
    out: api/ts
    opt:
      - target=js+dts

syntax = "proto3";

package bridge.v1;

// BridgeFileSystemService serves a read-only view of allowed paths on the
// bridge proxy pod so the local devcontainer can FUSE-mount them. Operations
// are stateless: each RPC takes an absolute path and the server enforces an
// allowlist of mount roots configured at startup.
service BridgeFileSystemService {
  // Stat returns metadata for a single path.
  rpc Stat(StatRequest) returns (StatResponse);

  // ReadDir lists entries in a directory.
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);

  // ReadFile reads a byte range of a regular file. Clients chunk large reads
  // by issuing multiple requests with successive offsets.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // ReadLink returns the target of a symbolic link.
  rpc ReadLink(ReadLinkRequest) returns (ReadLinkResponse);
}

// FileType matches POSIX file type bits.
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIR = 2;
  FILE_TYPE_SYMLINK = 3;
}

// FileAttr describes a single inode.
message FileAttr {
  // POSIX mode (permission bits + type). Only the low 12 bits are meaningful
  // for permissions; the type is reported separately via the type field.
  uint32 mode = 1;

  // File size in bytes (0 for non-regular files).
  int64 size = 2;

  // Modification time as Unix seconds.
  int64 mod_time = 3;

  // File type.
  FileType type = 4;
}

message StatRequest {
  string path = 1;
}

message StatResponse {
  FileAttr attr = 1;
}

message ReadDirRequest {
  string path = 1;
}

message DirEntry {
  string name = 1;
  FileType type = 2;
  uint32 mode = 3;
}

message ReadDirResponse {
  repeated DirEntry entries = 1;
}

message ReadFileRequest {
  string path = 1;

  // Byte offset to start reading at.
  int64 offset = 2;

  // Maximum number of bytes to read. Server may return fewer at EOF.
  int64 size = 3;
}

message ReadFileResponse {
  bytes data = 1;

  // True when offset+len(data) reaches the end of the file.
  bool eof = 2;
}

message ReadLinkRequest {
  string path = 1;
}

message ReadLinkResponse {
  string target = 1;
}

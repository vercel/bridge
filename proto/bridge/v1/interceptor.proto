syntax = "proto3";

package bridge.v1;

// InterceptorService runs inside the devcontainer and reports the current
// state of the local intercept process — initialization, tunnel health, and
// live results of the source deployment's probes against the developer's
// local app.
service InterceptorService {
  // GetStatus returns the current state of the intercept process. Safe to
  // call repeatedly; the response is built from cached probe results and
  // does not trigger fresh probe runs.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  // True once the intercept has finished setup (DNS, iptables, tunnel) and
  // is forwarding traffic. Independent of the app's own health.
  bool ready = 1;

  // Liveness probe result against the local app. Unset if no liveness
  // probe was configured on the source.
  ProbeStatus liveness = 2;

  // Readiness probe result against the local app. Unset if no readiness
  // probe was configured on the source.
  ProbeStatus readiness = 3;

  // Startup probe result against the local app. Unset if no startup
  // probe was configured on the source.
  ProbeStatus startup = 4;
}

// ProbeStatus reflects the current health view from a single configured
// probe — what the source deployment's probe would have reported if it had
// been run against the developer's local app.
message ProbeStatus {
  // ProbeHealth summarises the latest result.
  ProbeHealth health = 1;

  // Human-readable last result (e.g. "HTTP 200", "connection refused",
  // "exit status 1"). Empty before the first check completes.
  string message = 2;

  // Unix seconds of the most recent check. Zero before the first check.
  int64 last_check_unix_seconds = 3 [json_name = "last_check_unix_seconds"];

  // Consecutive successful checks since the last failure (or startup).
  int32 consecutive_successes = 4 [json_name = "consecutive_successes"];

  // Consecutive failed checks since the last success (or startup).
  int32 consecutive_failures = 5 [json_name = "consecutive_failures"];

  // Total checks executed since intercept startup.
  int64 total_checks = 6 [json_name = "total_checks"];
}

enum ProbeHealth {
  PROBE_HEALTH_UNSPECIFIED = 0;
  // Probe has not yet run a check.
  PROBE_HEALTH_PENDING = 1;
  // Last check passed and the configured success_threshold has been met.
  PROBE_HEALTH_HEALTHY = 2;
  // Probe has been failing — failure_threshold consecutive failures.
  PROBE_HEALTH_UNHEALTHY = 3;
}
